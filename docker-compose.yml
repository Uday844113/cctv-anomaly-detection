version: "3.9"

services:
  api:
    build: .
    container_name: cctv-api
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
    restart: unless-stopped

  dashboard:
    build: .
    container_name: cctv-dashboard
    ports:
      - "8501:8501"
    environment:
      - API_BASE=http://cctv-api:8000
    depends_on:
      - api
    volumes:
      - ./data:/app/data
    restart: unless-stopped